<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 420" width="320" height="420" fill="none">
  <defs>
    <!-- Glass jar body gradient - dark amber/forest tones -->
    <linearGradient id="jarGradFo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C3018" stop-opacity="0.6"/>
      <stop offset="18%" stop-color="#7B4F2E" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#8B5A30" stop-opacity="1"/>
      <stop offset="82%" stop-color="#7B4F2E" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#4A2010" stop-opacity="0.7"/>
    </linearGradient>
    <!-- Honey fill gradient - dark forest honey -->
    <linearGradient id="honeyFillFo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5A30"/>
      <stop offset="50%" stop-color="#6B3A18"/>
      <stop offset="100%" stop-color="#4A2010"/>
    </linearGradient>
    <!-- Lid gradient - darker metallic -->
    <linearGradient id="lidGradFo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C8C0B0"/>
      <stop offset="30%" stop-color="#A8A090"/>
      <stop offset="70%" stop-color="#887870"/>
      <stop offset="100%" stop-color="#706050"/>
    </linearGradient>
    <!-- Glass highlight -->
    <linearGradient id="glassHighFo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="12%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="28%" stop-color="white" stop-opacity="0"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <!-- Label gradient -->
    <linearGradient id="labelGradFo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A4030" stop-opacity="0.92"/>
      <stop offset="100%" stop-color="#1A2820" stop-opacity="0.92"/>
    </linearGradient>
    <clipPath id="jarClipFo">
      <path d="M76,140 Q70,150 68,180 L60,340 Q58,370 160,372 Q262,370 260,340 L252,180 Q250,150 244,140 Z"/>
    </clipPath>
  </defs>

  <!-- Jar body outline / glass -->
  <path d="M76,140 Q70,150 68,180 L60,340 Q58,370 160,372 Q262,370 260,340 L252,180 Q250,150 244,140 Z"
        fill="url(#jarGradFo)" stroke="#5C3018" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Honey fill inside jar (clipped) -->
  <rect x="60" y="195" width="200" height="177" fill="url(#honeyFillFo)" clip-path="url(#jarClipFo)"/>

  <!-- Honey surface — dark, viscous -->
  <ellipse cx="160" cy="195" rx="94" ry="7" fill="#7B4F2E" opacity="0.8" clip-path="url(#jarClipFo)"/>
  <path d="M80,197 Q120,188 160,195 Q200,202 240,196" stroke="#8B5A30" stroke-width="2" fill="none" opacity="0.4" clip-path="url(#jarClipFo)"/>

  <!-- Glass highlight stripe -->
  <rect x="60" y="140" width="200" height="232" rx="0" fill="url(#glassHighFo)" clip-path="url(#jarClipFo)"/>

  <!-- Honey drip at top — dark -->
  <path d="M145,140 Q143,128 146,118 Q148,112 150,110 Q152,112 154,118 Q157,128 155,140"
        fill="#6B3A18" opacity="0.9"/>
  <ellipse cx="150" cy="110" rx="4" ry="5" fill="#4A2010" opacity="0.95"/>

  <!-- Label area — dark forest theme -->
  <rect x="90" y="218" width="140" height="118" rx="4" fill="url(#labelGradFo)" stroke="#4A7040" stroke-width="0.8"/>

  <!-- Label decorative lines -->
  <line x1="104" y1="230" x2="216" y2="230" stroke="#6A9060" stroke-width="0.6" opacity="0.5"/>
  <line x1="104" y1="326" x2="216" y2="326" stroke="#6A9060" stroke-width="0.6" opacity="0.5"/>

  <!-- Pine needle / leaf motif -->
  <g transform="translate(134,240)" opacity="0.3">
    <line x1="26" y1="0" x2="26" y2="16" stroke="#A8C08A" stroke-width="0.8"/>
    <line x1="26" y1="4" x2="18" y2="0" stroke="#A8C08A" stroke-width="0.7"/>
    <line x1="26" y1="4" x2="34" y2="0" stroke="#A8C08A" stroke-width="0.7"/>
    <line x1="26" y1="8" x2="15" y2="3" stroke="#A8C08A" stroke-width="0.7"/>
    <line x1="26" y1="8" x2="37" y2="3" stroke="#A8C08A" stroke-width="0.7"/>
    <line x1="26" y1="12" x2="14" y2="7" stroke="#A8C08A" stroke-width="0.7"/>
    <line x1="26" y1="12" x2="38" y2="7" stroke="#A8C08A" stroke-width="0.7"/>
  </g>

  <!-- Brand name on label -->
  <text x="160" y="272" text-anchor="middle" font-family="Georgia, serif" font-size="10" font-weight="400" letter-spacing="2.5" fill="#D0E8C0" opacity="0.9">SIBERIAN GOLD</text>

  <!-- Variant name -->
  <text x="160" y="293" text-anchor="middle" font-family="Georgia, serif" font-size="9.5" font-weight="300" letter-spacing="2.5" fill="#A8C08A" opacity="0.8">FOREST HONEY</text>

  <!-- Weight -->
  <text x="160" y="315" text-anchor="middle" font-family="Georgia, serif" font-size="8" font-weight="300" letter-spacing="2" fill="#88A070" opacity="0.65">250g</text>

  <!-- Neck of jar -->
  <path d="M112,90 Q108,100 106,115 L106,140 L214,140 L214,115 Q212,100 208,90 Z"
        fill="#7B5030" stroke="#5C3018" stroke-width="1" stroke-opacity="0.4"/>
  <rect x="106" y="130" width="108" height="10" fill="#6B4020" opacity="0.5"/>

  <!-- Lid -->
  <rect x="98" y="68" width="124" height="26" rx="4" fill="url(#lidGradFo)" stroke="#706050" stroke-width="1"/>
  <rect x="100" y="68" width="120" height="5" rx="2" fill="#C0B8A8" opacity="0.5"/>
  <!-- Lid knurling -->
  <line x1="110" y1="72" x2="110" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="125" y1="72" x2="125" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="140" y1="72" x2="140" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="155" y1="72" x2="155" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="170" y1="72" x2="170" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="185" y1="72" x2="185" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="200" y1="72" x2="200" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>
  <line x1="210" y1="72" x2="210" y2="92" stroke="#706050" stroke-width="0.5" opacity="0.4"/>

  <!-- Lid highlight -->
  <rect x="100" y="70" width="40" height="6" rx="1" fill="white" opacity="0.12"/>

  <!-- Right edge shadow -->
  <path d="M244,140 Q250,150 252,180 L260,340 Q262,360 240,368"
        stroke="#3A1808" stroke-width="3" fill="none" opacity="0.2"/>

  <!-- Bottom highlight -->
  <ellipse cx="160" cy="370" rx="90" ry="4" fill="#7B5030" opacity="0.15"/>
</svg>
